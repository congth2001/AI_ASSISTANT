# Deterministic mapping from the real iShopman schema to the ETL canonical contract.
# Sorting uses `sort_by` (source columns, applied in pandas): the MDBTools ODBC driver on
# Linux cannot parse ORDER BY. Do not map `Single` (float4) columns such as
# exim_*_details.discount: MDBTools 1.0 ODBC returns a neighbouring column value for them.
datasets:
  products:
    enabled: true
    table: goods
    columns:
      product_id: goods_id
      category_id: category_id
      product_name: goods_name
      unit_name: unit
    sort_by: [goods_id]
    filename: products

  product_categories:
    enabled: true
    table: goods_category
    columns:
      category_id: category_id
      product_category_name: category_name
    sort_by: [category_id]
    filename: product_categories

  customers:
    enabled: true
    table: contacts
    columns:
      customer_id: contact_id
      customer_name: contact_name
      address_detail: address_local
      opening_receivable: phaithu_dauky
    sort_by: [contact_id]
    filename: customers

  sales:
    enabled: true
    table: exim_export_invoice
    columns:
      invoice_id: invoice_id
      invoice_number: invoice_no
      customer_id: contact_id
      issued_at: invoice_date
      invoice_total_amount: total_cost
      debt_delta_amount: money_debit
    sort_by: [invoice_id]
    filename: sales

  sale_items:
    enabled: true
    table: exim_export_invoice_details
    columns:
      source_line_id: id
      invoice_id: invoice_id
      product_id: goods_id
      quantity: quantity
      unit_price: unit_price
    sort_by: [invoice_id, id]
    filename: sale_items

  debt_receipts:
    enabled: true
    table: receipt_debt
    columns:
      source_id: invoice_id
      customer_id: contact_id
      occurred_at: invoice_date
      amount: invoice_val
    sort_by: [invoice_id]
    filename: debt_receipts

  sales_returns:
    enabled: true
    table: exim_import_invoice
    columns:
      source_id: invoice_id
      return_number: invoice_no
      customer_id: contact_id
      occurred_at: invoice_date
      return_total_amount: total_cost
      amount: money_debit
    where: "[reason] = 'NT'"
    sort_by: [invoice_id]
    filename: sales_returns

  sales_return_items:
    enabled: true
    table: exim_import_invoice_details
    columns:
      source_line_id: id
      source_id: invoice_id
      product_id: goods_id
      quantity: quantity
      unit_price: unit_price
    sort_by: [invoice_id, id]
    filename: sales_return_items

extra_tables: []
